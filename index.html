<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2346c4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Caderno de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: caderno de academia — barra de abas fixa no topo, uma coluna estreita de cartões funcionais, números tabulares */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f9; --line:#d9dde5;
  --fg:#16191f; --muted:#5d6574; --accent:#2346c4; --accent-soft:#e3e9fb;
  --prot:#c2410c; --prot-soft:#fbe7dc; --ok:#15803d; --warn:#b45309;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2b313d;
  --fg:#e8eaef; --muted:#9aa2b2; --accent:#7f9bff; --accent-soft:#1d2645;
  --prot:#fb923c; --prot-soft:#3a2214; --ok:#4ade80; --warn:#fbbf24; --on-accent:#0f1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2b313d;
  --fg:#e8eaef; --muted:#9aa2b2; --accent:#7f9bff; --accent-soft:#1d2645;
  --prot:#fb923c; --prot-soft:#3a2214; --ok:#4ade80; --warn:#fbbf24; --on-accent:#0f1115; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{max-width:760px;margin:0 auto;padding:10px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:2px 12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
nav.tabs{max-width:760px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;background:none;border:0;color:var(--muted);padding:8px 7px 10px;flex:1;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost,label.ghost{font:inherit;font-weight:600;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal .num{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1}
.goal .num small{white-space:nowrap}
.goal .num small{font-size:16px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.p i{background:var(--prot)}
.macros{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.p{background:var(--prot-soft);color:var(--prot)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.exhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.exhead b{font-weight:700}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.set{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.set span{font-size:12px;color:var(--muted);width:18px}
.set input{width:100%;padding:5px 6px;text-align:center;background:var(--surface)}
.set em{font-style:normal;color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.plan{display:grid;gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.day h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.day h2 small{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.day ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.day li span{color:var(--muted)}
.home{border-color:var(--accent);background:var(--accent-soft)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foods button{text-align:left;font:inherit;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.foods button:hover{border-color:var(--accent)}
.foods small{color:var(--muted)}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .m{min-width:0}
.meal .m b{display:block;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:560px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .full{grid-column:1/-1}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
details.how{font-size:14px}
details.how summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+";font-weight:700;width:12px}
details.how[open] summary::before{content:"−"}
details.how ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
details.how .tip{color:var(--muted);font-size:13px;margin-top:4px}
.streak{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.streak .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.streak .big small{font-size:16px;color:var(--muted);font-weight:500}
.week{display:flex;gap:6px;flex-wrap:wrap}
.week span{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.week span.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.week span.today{outline:2px solid var(--accent);outline-offset:1px}
.menuimg{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.picks{display:grid;gap:8px}
.picks label{flex-direction:row;align-items:center;gap:10px}
.picks label b{width:34px;color:var(--fg)}
.picks input{flex:1}
.jantar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.supl{display:grid;gap:10px}
.prod{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.prod.sel{border-color:var(--accent);background:var(--accent-soft)}
.prod .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.prod a{color:var(--accent);font-weight:600}
.prod .f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prod .f input{background:var(--surface)}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--fg)}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dayt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:2px 0 4px;text-transform:uppercase;text-wrap:balance}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{font-family:var(--display);font-size:22px;color:var(--fg);line-height:1}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.sec>summary h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.sec>summary h2 small{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.secbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.doneb{font:inherit;font-size:13px;font-weight:700;border-radius:99px;padding:6px 12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap}
.ex.feito .doneb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex.feito>:not(.exhead):not(.exsum){display:none}
.exsum{display:none;font-variant-numeric:tabular-nums}.ex.feito .exsum{display:block}
.ex.feito .exhead b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.feitos{font-weight:600;color:var(--muted)}
.done-tag{font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pm{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pm:last-child{border-bottom:0}
.pm .h{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.pm .d b{display:block}
.pm .d span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pm button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap}
.pm button.on{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.pm.on .d b{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.more[open]{display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--fg);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer .wk{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.timer .wk .lb{font-size:11px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.timer .wk b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.timer .dot{width:9px;height:9px;border-radius:50%;background:var(--prot);align-self:center;flex:none}
.timer .acts{display:flex;gap:6px}
.timer .rb{order:3;width:100%;display:flex;align-items:center;gap:8px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.timer .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.timer .t{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;min-width:76px}
.timer .lb{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;min-width:0}
.timer .rb .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .bar2{position:absolute;left:0;top:0;height:4px;background:var(--accent)}
.timer button{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:8px 9px;white-space:nowrap;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.timer.fim{background:var(--ok)}
body.timing .wrap{padding-bottom:150px}
body.timing .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.kgf span{display:flex;align-items:center;gap:6px}.kgf span[hidden],.linkb[hidden]{display:none}
.kgf input{width:64px;text-align:center;font-weight:700;font-size:17px}
.kgf.bw{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.kgf .bwt{font-weight:700;font-size:14px}
.linkb{font:inherit;font-size:13px;font-weight:600;background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer}
.kgf em{font-style:normal;color:var(--muted);font-size:13px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;min-width:0}
.rp{gap:3px;font-size:11px}
.rp input{width:52px;text-align:center;font-size:17px;padding:7px 4px}
.rest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rest button{font:inherit;font-size:13px;font-weight:600;border-radius:99px;padding:6px 12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.exhead .restb{font:inherit;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.exhead .restb,.rest button,.pm button{min-height:44px}
.exhead .restb{padding:6px 12px;font-size:13px}
.rest button{padding:8px 14px}
.pm button{padding:8px 14px;font-size:14px}
input,select{min-height:44px}
.rp input{width:100%}
details.how summary{min-height:40px}
details.more>summary{min-height:44px;display:flex;align-items:center}
.checks label{min-height:44px;padding-right:6px}
.checks input{width:26px;height:26px}
.timer button{min-height:44px;min-width:44px}
nav.tabs button{min-height:44px}
button.dangerb{color:#dc2626;border-color:#dc2626;margin-left:auto}
.danger{position:fixed;inset:0;z-index:100;background:#b91c1c;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.danger[hidden]{display:none}
.danger .dbox{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.danger .dico{width:64px;height:64px;border-radius:50%;border:4px solid #fff;font:800 40px/56px var(--display);margin:0 auto}
.danger h2{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;text-transform:uppercase;color:#fff}
.danger p{margin:0;font-size:16px}.danger .dstep{font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.danger .dacts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.danger button{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:14px;cursor:pointer}
#dgOk{background:#fff;color:#b91c1c;border:0}#dgOk:disabled{opacity:.55;cursor:default}
#dgNo{background:transparent;color:#fff;border:2px solid #fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<header class="top">
  <div class="brand"><h1>Caderno de <span>Treino</span></h1><span class="sync" id="sync">Carregando…</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="hoje" aria-selected="true">Hoje</button>
    <button role="tab" data-tab="semana" aria-selected="false">Semana</button>
    <button role="tab" data-tab="progresso" aria-selected="false">Progresso</button>
    <button role="tab" data-tab="mais" aria-selected="false">Mais</button>
  </nav>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div class="danger" id="danger" hidden role="alertdialog" aria-modal="true" aria-labelledby="dgT"><div class="dbox">
  <div class="dico" aria-hidden="true">!</div><p class="dstep" id="dgS">Etapa 1 de 2</p>
  <h2 id="dgT"></h2><p id="dgX"></p>
  <div class="dacts"><button id="dgOk"></button><button id="dgNo">Cancelar</button></div>
</div></div>
<div class="timer" id="timer" hidden role="timer" aria-live="polite"><i class="bar2" id="tBar"></i><div class="in">
  <div class="wk"><i class="dot"></i><span class="lb">Em treino</span><b id="wkEl">0:00</b></div>
  <div class="acts"><button id="wkFim">Finalizar</button><button id="wkX" aria-label="Ocultar a barra">×</button></div>
  <div class="rb" id="restBox" hidden><span class="t" id="tTime">1:30</span><span class="lb" id="tLb">Descanso</span><button id="tMenos">−15s</button><button id="tMais">+15s</button><button id="tStop">Parar</button></div>
</div></div>

<script>
const PWA=true; // true na versão instalável (site próprio)
// ---------- Plano de treino ----------
const PLAN = {
  push:{nome:"Push", foco:"Peito, ombro e tríceps", dia:1, ex:[
    ["Supino reto com barra","4x6-8"],["Supino inclinado com halteres","3x8-10"],["Desenvolvimento com halteres","3x8-10"],
    ["Elevação lateral","4x12-15"],["Crucifixo no peck deck","3x12"],["Tríceps na polia com corda","3x10-12"]]},
  pull:{nome:"Pull", foco:"Costas e bíceps", dia:2, ex:[
    ["Barra fixa (ou puxada alta)","4x6-10"],["Remada curvada com barra","4x8"],["Remada baixa sentado","3x10"],
    ["Face pull","3x15"],["Rosca direta com barra","3x8-10"],["Rosca martelo","3x10-12"]]},
  pernas:{nome:"Pernas", foco:"Quadríceps, posterior e panturrilha", dia:3, ex:[
    ["Agachamento livre","4x6-8"],["Leg press 45°","3x10-12"],["Stiff com barra","3x8-10"],
    ["Cadeira extensora","3x12-15"],["Mesa flexora","3x10-12"],["Panturrilha em pé","4x12-15"]]},

const TM={ac:null,beeped:false};
function beep(){try{const ac=TM.ac;if(!ac)return;[0,0.35,0.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=t>0.6?1320:880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.28);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.3)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}}
function fmtLong(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wakeLock&&document.visibilityState==="visible"){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch(e){}}
function wkStart(){if(!WK.start){WK.start=Date.now();toast("Treino iniciado")}WK.hidden=false;wkSave();keepAwake();wkTick();notifPedir().then(notif)}
function wkEnd(){WK={};wkSave();try{wakeLock&&wakeLock.release()}catch(e){}wkTick();notif()}
function startRest(sec){
  try{if(!TM.ac)TM.ac=new (window.AudioContext||window.webkitAudioContext)();TM.ac.resume&&TM.ac.resume()}catch(e){}
  if(!WK.start)WK.start=Date.now();
  WK.restEnd=Date.now()+sec*1000;WK.restTotal=sec;WK.hidden=false;TM.beeped=false;wkSave();keepAwake();wkTick();notifPedir().then(notif);
}
function stopRest(){delete WK.restEnd;wkSave();wkTick();notif()}
function wkTick(){
  const now=Date.now(),active=!!WK.start,show=active&&!WK.hidden;
  timer.hidden=!show;document.body.classList.toggle("timing",show);
  if(!active){restBox.hidden=true;return}
  wkEl.textContent=fmtLong((now-WK.start)/1000);
  const resting=WK.restEnd!=null,left=resting?(WK.restEnd-now)/1000:0;
  restBox.hidden=!resting;timer.classList.toggle("fim",resting&&left<=0);
  if(resting){tTime.textContent=fmtT(left);tLb.textContent=left>0?"Descanso":"Próxima série!";
    tBar.style.width=Math.max(0,Math.min(100,(1-left/WK.restTotal)*100))+"%";
    if(left<=0&&!TM.beeped){TM.beeped=true;beep();notif(true)}
    if(left<-20)stopRest();}
  else tBar.style.width="0%";
}

async function exportar(){
  const menu={...S.menu};delete menu.localImg;
  const data=JSON.stringify({app:"caderno-de-treino",versao:1,exportado:new Date().toISOString(),profile:S.profile,days:S.days,menu,supl:S.supl},null,1);
  const nome="caderno-de-treino-"+hojeISO()+".json";
  try{if(window.claude&&claude.use){const dl=await claude.use("downloads");if(dl){await dl.save({filename:nome,data});toast("Arquivo exportado");return}}}
  catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Arquivo exportado");
}
function importar(f){
  const fr=new FileReader();
  fr.onload=async()=>{let j;try{j=JSON.parse(fr.result)}catch(e){toast("Arquivo inválido");return}
    if(!j||j.app!=="caderno-de-treino"||typeof j.days!=="object"){toast("Esse arquivo não é um backup do app");return}
    const n=Object.keys(j.days).length;
    const iguais=Object.keys(j.days).filter(d=>S.days[d]).length;
    if(iguais&&!await confirmar2("Substituir dados?",`O arquivo tem ${n} dias e ${iguais} deles já existem aqui. Os dias com a mesma data serão trocados pelos do arquivo.`,"O que está registrado nesses dias"))return;
    Object.entries(j.days).forEach(([iso,d])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(iso)&&d&&typeof d==="object"){S.days[iso]={...d,kind:"day",date:iso};saveDay(iso)}});
    if(j.profile&&typeof j.profile==="object"){const {kind,...p}=j.profile;S.profile={...DEFAULT_PROFILE,...p};saveProfile()}
    if(j.supl&&typeof j.supl==="object"){S.supl=j.supl;saveSupl()}
    if(j.menu&&j.menu.ini&&(!S.menu.ini||j.menu.ini>S.menu.ini)){S.menu=pickMenu(j.menu);if(PWA)delete S.menu.assetId;saveMenu()}
    lsSave();toast(n===1?"1 dia importado":n+" dias importados");render();
  };
  fr.readAsText(f);
}

const RS={t:null,pend:null};
function draftLsSave(){try{localStorage.setItem(LS+"-draft",JSON.stringify(S.draft))}catch(e){}}

// Confirmação em duas etapas, em tela vermelha, antes de qualquer ação que apaga dados
function confirmar2(titulo,texto,acao){
  return new Promise(res=>{
    let dgTimer;
    const esc_=e=>{if(e.key==="Escape")fim(false)};
    const fim=ok=>{danger.hidden=true;clearInterval(dgTimer);document.removeEventListener("keydown",esc_);res(ok)};
    const etapa=n=>{
      dgS.textContent=`Etapa ${n} de 2`;
      if(n===1){dgT.textContent=titulo;dgX.textContent=texto;dgOk.textContent="Sim, quero apagar";dgOk.disabled=false;dgOk.onclick=()=>etapa(2)}
      else{dgT.textContent="Tem certeza?";dgX.textContent="Isso não pode ser desfeito. "+acao+" será apagado de vez.";
        let t=3;dgOk.disabled=true;dgOk.textContent=`Apagar de vez (${t})`;
        dgTimer=setInterval(()=>{t--;if(t>0)dgOk.textContent=`Apagar de vez (${t})`;else{clearInterval(dgTimer);dgOk.disabled=false;dgOk.textContent="Apagar de vez"}},1000);
        dgOk.onclick=()=>fim(true)}
    };
    dgNo.onclick=()=>fim(false);document.addEventListener("keydown",esc_);
    etapa(1);danger.hidden=false;dgNo.focus();
  });
}

// ---------- Sequência ----------
function addDias(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function wd(iso){return new Date(iso+"T12:00:00").getDay()}
function treinou(iso){return !!S.days[iso]?.treino}
function seqTreino(){
  // conta dias úteis seguidos com treino; fim de semana não quebra; hoje sem treino ainda não quebra
  const hoje=hojeISO();let d=hoje,n=0;
  if(!treinou(d))d=addDias(d,-1);
  for(let i=0;i<400;i++){const w=wd(d);
    if(w===0||w===6){if(treinou(d))n++;d=addDias(d,-1);continue}
    if(!treinou(d))break;n++;d=addDias(d,-1)}
  return n;
}
function recordeTreino(){
  const ds=Object.keys(S.days).filter(treinou).sort();if(!ds.length)return 0;
  let best=0,cur=0,d=ds[0];const end=hojeISO();
  while(d<=end){const w=wd(d);
    if(treinou(d)){cur++;best=Math.max(best,cur)}else if(w!==0&&w!==6&&d!==end)cur=0;
    d=addDias(d,1)}
  return best;
}
function bateuProt(iso){const M=metas(profileVivo());return totaisDia(iso).p>=M.prot*0.9}
function seqProt(){let d=hojeISO(),n=0;if(!bateuProt(d))d=addDias(d,-1);for(let i=0;i<400&&bateuProt(d);i++){n++;d=addDias(d,-1)}return n}
function cardStreak(){
  const hoje=hojeISO(),w=wd(hoje),seg=addDias(hoje,-((w+6)%7));
  const dots=[0,1,2,3,4].map(i=>{const d=addDias(seg,i);return `<span class="${treinou(d)?"on":""} ${d===hoje?"today":""}" title="${fmtData(d)}">${DIAS[i+1]}</span>`}).join("");
  const st=seqTreino(),rec=Math.max(recordeTreino(),st),sp=seqProt();
  return `<section class="card">
    <div class="row between"><h2>Sequência</h2><div class="week" aria-label="Treinos desta semana">${dots}</div></div>
    <div class="streak">
      <div><h3>Treinos seguidos</h3><div class="big">${st} <small>recorde ${rec}</small></div></div>
      <div><h3>Dias na meta de proteína</h3><div class="big">${sp} <small>${sp===1?"dia":"dias"}</small></div></div>
    </div>
    <p class="small muted">${st?"Não quebre a sequência: fim de semana não conta como falta.":"Salve o treino de hoje para começar a sequência."}</p>
  </section>`;
}

  return `<section class="card"><div class="jantar"><h3>Jantar no trabalho</h3><span>${esc(e)}</span></div></section>`}

  <section class="card"><h2>Faltou à academia? Treine em casa</h2>
  <p class="note">Cada treino tem uma versão de calistenia com os mesmos músculos. No fim de semana o app já sugere o treino que ficou sem registro. Em dia de semana, toque em "Vou treinar em casa" na tela Hoje.</p></section>
  ${Object.entries(PLAN).filter(([k,p])=>p.casa).map(([k,p])=>`<details class="sec">
    <summary><h2>${p.nome} <small>${p.foco}</small></h2></summary>
    <div class="secbody"><ol style="margin:0;padding-left:20px;display:grid;gap:6px">${p.ex.map(([n,r])=>`<li>${esc(n)} <span class="muted">${r}</span>${howHtml(n)}</li>`).join("")}</ol></div>
  </details>`).join("")}`;
}

function vProgresso(){
  const ds=Object.keys(S.days).sort();
  const pesos=ds.filter(d=>S.days[d].peso).map(d=>[d,S.days[d].peso]);
  const nomes=[...new Set(ds.flatMap(d=>S.days[d].treino?.ex?.filter(e=>e.sets.some(s=>s.kg)).map(e=>e.nome)||[]))];
  if(!S.exSel||!nomes.includes(S.exSel))S.exSel=nomes[0]||null;
  const prog=S.exSel?ds.map(d=>{const e=S.days[d].treino?.ex?.find(x=>x.nome===S.exSel);if(!e)return null;
    const best=e.sets.filter(s=>s.kg&&s.reps).reduce((a,s)=>{const rm=s.kg*(1+s.reps/30);return rm>a.rm?{...s,rm}:a},{rm:0});
    return best.rm?[d,best]:null}).filter(Boolean):[];
  const recent=ds.slice().reverse().slice(0,30);
  app.innerHTML=`${cardStreak()}
  <section class="card"><div class="row between"><h2>Peso corporal</h2>${pesos.length?`<span class="chip p">${pesos.at(-1)[1]} kg${pesos.length>1?` · ${(pesos.at(-1)[1]-pesos[0][1]>=0?"+":"")}${r1(pesos.at(-1)[1]-pesos[0][1])} kg`:""}</span>`:""}</div>
    ${pesos.length>=2?chart(pesos.map(([d,v])=>[d,v]),"kg"):`<p class="empty">Registre o peso em "Hoje" pelo menos 2 vezes para ver o gráfico. Dica: pese-se 1× por semana, em jejum. Meta para ganho limpo: +0,25 a 0,5 kg por semana.</p>`}
  </section>
  <section class="card"><div class="row between"><h2>Evolução de carga</h2>${nomes.length?`<select id="exSel" aria-label="Exercício">${nomes.map(n=>`<option ${n===S.exSel?"selected":""}>${esc(n)}</option>`).join("")}</select>`:""}</div>
    ${prog.length>=2?chart(prog.map(([d,b])=>[d,r1(b.rm)]),"kg (1RM est.)"):""}
    ${prog.length?`<div class="tablewrap"><table><tr><th>Data</th><th class="r">Melhor série</th><th class="r">1RM estimado</th></tr>${prog.slice().reverse().map(([d,b])=>`<tr><td>${fmtData(d)}</td><td class="r">${b.kg} kg × ${b.reps}</td><td class="r">${r1(b.rm)} kg</td></tr>`).join("")}</table></div>`:`<p class="empty">Salve treinos com carga em "Hoje" para acompanhar a evolução de cada exercício.</p>`}
  </section>
  <section class="card"><h2>Histórico</h2>
    ${recent.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Treino</th><th class="r">Volume</th><th class="r">kcal</th><th class="r">Prot</th><th class="r">Peso</th></tr>
    ${recent.map(d=>{const x=S.days[d],t=totaisDia(d);const vol=x.treino?x.treino.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.kg||0)*(s.reps||0),0),0):0;
      return `<tr><td>${DIAS[new Date(d+"T12:00:00").getDay()]} ${fmtData(d)}</td><td>${x.treino?PLAN[x.treino.sessao]?.nome||"-":"-"}</td><td class="r">${vol?r0(vol)+" kg":"-"}</td><td class="r">${t.kcal?r0(t.kcal):"-"}</td><td class="r">${t.p?r0(t.p)+" g":"-"}</td><td class="r">${x.peso?x.peso+" kg":"-"}</td></tr>`}).join("")}
    </table></div>`:`<p class="empty">Seu histórico aparece aqui depois do primeiro treino ou refeição salva.</p>`}
  </section>`;
  if(window.exSel)exSel.onchange=e=>{S.exSel=e.target.value;render()};
}

function chart(pts,unit){
  const W=640,H=200,pl=40,pr=14,pt=14,pb=26;
  const vs=pts.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<2){mn-=1;mx+=1}
  const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const x=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1)),y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ticks=[mn+pad,(mn+mx)/2,mx-pad];
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area=`${line}L${x(pts.length-1).toFixed(1)},${H-pb}L${pl},${H-pb}Z`;
  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico em ${unit}" style="min-width:320px">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r1(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}
    ${lbl.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${fmtData(pts[i][0])}</text>`).join("")}
  </svg></div>`;
}

      <tr><td>Carboidrato (o resto)</td><td class="r">${r0(M.carb)} g</td></tr>
    </table></div>
    <p class="note">Se o peso não subir em 2 semanas, aumente o superávit em 150 a 200 kcal. Se subir mais de 0,5 kg por semana, reduza.</p>
  </section>
  <p class="small muted">Os dados ficam salvos na sua conta Claude e só você vê. Fora do Claude, ficam salvos neste navegador.</p>`;
  salvarP.onclick=()=>{const n=id=>parseFloat(document.getElementById(id).value);
    Object.assign(S.profile,{sexo:pSexo.value,idade:n("pIdade"),altura:n("pAlt"),peso:n("pPeso"),atividade:n("pAtv"),superavit:n("pSup"),protkg:n("pProt"),gordkg:n("pGord")});
    saveProfile();toast("Perfil salvo");render();};

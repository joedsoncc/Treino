<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2346c4"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Caderno de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: caderno de academia — barra de abas fixa no topo, uma coluna estreita de cartões funcionais, números tabulares */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f9; --line:#d9dde5;
  --fg:#16191f; --muted:#5d6574; --accent:#2346c4; --accent-soft:#e3e9fb;
  --prot:#c2410c; --prot-soft:#fbe7dc; --ok:#15803d; --warn:#b45309;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2b313d;
  --fg:#e8eaef; --muted:#9aa2b2; --accent:#7f9bff; --accent-soft:#1d2645;
  --prot:#fb923c; --prot-soft:#3a2214; --ok:#4ade80; --warn:#fbbf24; --on-accent:#0f1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --line:#2b313d;
  --fg:#e8eaef; --muted:#9aa2b2; --accent:#7f9bff; --accent-soft:#1d2645;
  --prot:#fb923c; --prot-soft:#3a2214; --ok:#4ade80; --warn:#fbbf24; --on-accent:#0f1115; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 48px;display:flex;flex-direction:column;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{max-width:760px;margin:0 auto;padding:10px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:2px 12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
nav.tabs{max-width:760px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;background:none;border:0;color:var(--muted);padding:8px 7px 10px;flex:1;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.ghost,label.ghost{font:inherit;font-weight:600;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal .num{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1}
.goal .num small{white-space:nowrap}
.goal .num small{font-size:16px;color:var(--muted);font-weight:500}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.p i{background:var(--prot)}
.macros{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.p{background:var(--prot-soft);color:var(--prot)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.exhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.exhead b{font-weight:700}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.set{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.set span{font-size:12px;color:var(--muted);width:18px}
.set input{width:100%;padding:5px 6px;text-align:center;background:var(--surface)}
.set em{font-style:normal;color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.plan{display:grid;gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.day h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.day h2 small{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.day ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.day li span{color:var(--muted)}
.home{border-color:var(--accent);background:var(--accent-soft)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foods button{text-align:left;font:inherit;font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.foods button:hover{border-color:var(--accent)}
.foods small{color:var(--muted)}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .m{min-width:0}
.meal .m b{display:block;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:560px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .full{grid-column:1/-1}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
details.how{font-size:14px}
details.how summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+";font-weight:700;width:12px}
details.how[open] summary::before{content:"−"}
details.how ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
details.how .tip{color:var(--muted);font-size:13px;margin-top:4px}
.streak{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.streak .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.streak .big small{font-size:16px;color:var(--muted);font-weight:500}
.week{display:flex;gap:6px;flex-wrap:wrap}
.week span{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.week span.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.week span.today{outline:2px solid var(--accent);outline-offset:1px}
.menuimg{max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.picks{display:grid;gap:8px}
.picks label{flex-direction:row;align-items:center;gap:10px}
.picks label b{width:34px;color:var(--fg)}
.picks input{flex:1}
.jantar{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.supl{display:grid;gap:10px}
.prod{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.prod.sel{border-color:var(--accent);background:var(--accent-soft)}
.prod .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.prod a{color:var(--accent);font-weight:600}
.prod .f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prod .f input{background:var(--surface)}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--fg)}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dayt{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:2px 0 4px;text-transform:uppercase;text-wrap:balance}
.pill{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pill b{font-family:var(--display);font-size:22px;color:var(--fg);line-height:1}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.sec>summary h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.sec>summary h2 small{font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500}
.secbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.doneb{font:inherit;font-size:13px;font-weight:700;border-radius:99px;padding:6px 12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap}
.ex.feito .doneb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ex.feito>:not(.exhead):not(.exsum){display:none}
.exsum{display:none;font-variant-numeric:tabular-nums}.ex.feito .exsum{display:block}
.ex.feito .exhead b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.feitos{font-weight:600;color:var(--muted)}
.done-tag{font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pm{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pm:last-child{border-bottom:0}
.pm .h{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.pm .d b{display:block}
.pm .d span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pm button{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:7px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;white-space:nowrap}
.pm button.on{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.pm.on .d b{color:var(--muted)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
details.more[open]{display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--fg);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer .wk{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.timer .wk .lb{font-size:11px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.timer .wk b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.timer .dot{width:9px;height:9px;border-radius:50%;background:var(--prot);align-self:center;flex:none}
.timer .acts{display:flex;gap:6px}
.timer .rb{order:3;width:100%;display:flex;align-items:center;gap:8px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent);padding-top:8px}
@media (prefers-reduced-motion:no-preference){.timer .dot{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.25}}
.timer .t{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;min-width:76px}
.timer .lb{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;min-width:0}
.timer .rb .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .bar2{position:absolute;left:0;top:0;height:4px;background:var(--accent)}
.timer button{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:8px 9px;white-space:nowrap;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.timer.fim{background:var(--ok)}
body.timing .wrap{padding-bottom:150px}
body.timing .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.exrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.kgf span{display:flex;align-items:center;gap:6px}.kgf span[hidden],.linkb[hidden]{display:none}
.kgf input{width:64px;text-align:center;font-weight:700;font-size:17px}
.kgf.bw{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.kgf .bwt{font-weight:700;font-size:14px}
.linkb{font:inherit;font-size:13px;font-weight:600;background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer}
.kgf em{font-style:normal;color:var(--muted);font-size:13px}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;min-width:0}
.rp{gap:3px;font-size:11px}
.rp input{width:52px;text-align:center;font-size:17px;padding:7px 4px}
.rest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rest button{font:inherit;font-size:13px;font-weight:600;border-radius:99px;padding:6px 12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.exhead .restb{font:inherit;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.exhead .restb,.rest button,.pm button{min-height:44px}
.exhead .restb{padding:6px 12px;font-size:13px}
.rest button{padding:8px 14px}
.pm button{padding:8px 14px;font-size:14px}
input,select{min-height:44px}
.rp input{width:100%}
details.how summary{min-height:40px}
details.more>summary{min-height:44px;display:flex;align-items:center}
.checks label{min-height:44px;padding-right:6px}
.checks input{width:26px;height:26px}
.timer button{min-height:44px;min-width:44px}
nav.tabs button{min-height:44px}
.lems{display:grid;gap:8px}.lem{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center}.lem input[type=checkbox]{width:22px;height:22px}.lem input[type=time]{width:auto}
/* App: tocar no texto não seleciona nem abre a busca do Android; campos de digitação continuam normais */
html{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button.dangerb{color:#dc2626;border-color:#dc2626;margin-left:auto}
.danger{position:fixed;inset:0;z-index:100;background:#b91c1c;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.danger[hidden]{display:none}
.danger .dbox{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.danger .dico{width:64px;height:64px;border-radius:50%;border:4px solid #fff;font:800 40px/56px var(--display);margin:0 auto}
.danger h2{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;text-transform:uppercase;color:#fff}
.danger p{margin:0;font-size:16px}.danger .dstep{font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.danger .dacts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.danger button{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:14px;cursor:pointer}
#dgOk{background:#fff;color:#b91c1c;border:0}#dgOk:disabled{opacity:.55;cursor:default}
#dgNo{background:transparent;color:#fff;border:2px solid #fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:9}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
/* ---- Revisão de design e acessibilidade (out/2026) ---- */
:root{--field-line:#8a93a3;--danger:#dc2626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--field-line:#4a5263;--danger:#f87171}}
:root[data-theme="dark"]{--field-line:#4a5263;--danger:#f87171}
input,select{border-color:var(--field-line)}
button.dangerb{color:var(--danger);border-color:var(--danger)}
.doneb{min-height:44px;padding:8px 16px;font-size:14px;margin-left:auto}
.exhead{flex-direction:column;align-items:stretch;gap:8px}
.exhead>.row{flex-wrap:nowrap}
.reps{grid-template-columns:repeat(auto-fit,minmax(44px,1fr))}
.ex,details.sec{scroll-margin-top:124px}
.rp input::placeholder,.kgf input::placeholder{color:var(--muted);opacity:.55;font-weight:400;font-style:italic}
.timer .rb .lb{white-space:normal;font-size:13px;line-height:1.1}
.timer .t{min-width:0;font-size:32px}
td:not(.r){white-space:normal}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{flex-wrap:nowrap;padding:6px 16px 0}.brand h1{font-size:20px}.sync{font-size:11px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pm{grid-template-columns:44px minmax(0,1fr);row-gap:6px}.pm .h{font-size:14px}.pm button{grid-column:2;justify-self:start}
.checks{align-items:center;gap:4px 16px}.checks>.small{flex-basis:100%}.checks label{padding:0 8px 0 0}
button.btn,button.ghost,label.ghost{min-height:44px}
details.how summary{min-height:44px}
.prod a{display:inline-block;padding:10px 0}
#salvarTreino,#iniciarTreino{flex:1;min-height:52px;font-size:17px}
.chip{text-transform:none;letter-spacing:.02em}
.secbody>.card{border:0;padding:0;background:none}
.week span.today{outline:0;box-shadow:inset 0 -3px 0 var(--accent)}
#dgOk:disabled{opacity:.8}
.timer.fim{background:#166534}
.feitos:empty{display:none}
/* Calendário de treinos */
:root{--cal-ok:#dcfce7;--cal-ok-fg:#14532d;--cal-ok-line:#86efac;--cal-up:#15803d;--cal-up-fg:#fff;--cal-miss:#fee2e2;--cal-miss-fg:#7f1d1d;--cal-miss-line:#fca5a5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cal-ok:#14391f;--cal-ok-fg:#bbf7d0;--cal-ok-line:#166534;--cal-up:#22c55e;--cal-up-fg:#052e16;--cal-miss:#3f1a1a;--cal-miss-fg:#fecaca;--cal-miss-line:#7f1d1d}}
:root[data-theme="dark"]{--cal-ok:#14391f;--cal-ok-fg:#bbf7d0;--cal-ok-line:#166534;--cal-up:#22c55e;--cal-up-fg:#052e16;--cal-miss:#3f1a1a;--cal-miss-fg:#fecaca;--cal-miss-line:#7f1d1d}
.calnav{display:flex;align-items:center;gap:6px}
.calnav button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:20px}
.calnav button:disabled{opacity:.35}
.calnav b{min-width:120px;text-align:center}
.resumo td{vertical-align:top}.resumo td small{display:block;color:var(--muted)}
.resumo .mud{display:block;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:600 14px var(--body);position:relative;padding:0}
.cal button.ok{background:var(--cal-ok);color:var(--cal-ok-fg);border-color:var(--cal-ok-line)}
.cal button.up{background:var(--cal-up);color:var(--cal-up-fg);border-color:var(--cal-up)}
.cal button.miss{background:var(--cal-miss);color:var(--cal-miss-fg);border-color:var(--cal-miss-line)}
.cal button.fut{opacity:.5}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.sel{outline:2px solid var(--fg);outline-offset:1px}
.cal button i{position:absolute;top:1px;right:4px;font-style:normal;font-size:11px}
.calleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.calleg span{display:inline-flex;align-items:center;gap:6px}
.calleg em{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.calleg .ok{background:var(--cal-ok);border-color:var(--cal-ok-line)}.calleg .up{background:var(--cal-up);border-color:var(--cal-up)}.calleg .miss{background:var(--cal-miss);border-color:var(--cal-miss-line)}
.calnum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.calnum div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.calnum b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.calnum small{color:var(--muted);font-size:12px}
.caldia{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.subiu{color:var(--ok);font-weight:700}
.pts{display:grid;gap:8px;background:var(--surface-2);border-radius:8px;padding:12px}
.pts .tot{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.pts .tot small{font-size:16px;color:var(--muted);font-weight:500}
.pts .bar{height:10px}.pts ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:13px}
.pts li{display:flex;justify-content:space-between}.neg{color:var(--danger);font-weight:700}
button.pill{font-family:var(--body);font-size:13px;cursor:pointer}
.pill.pt{border-color:var(--cal-ok-line);background:var(--cal-ok);color:var(--cal-ok-fg)}
/* Cores de destaque e letra grande (Configurações) */
:root[data-cor="verde"]{--accent:#15803d;--accent-soft:#dcfce7}
@media (prefers-color-scheme: dark){:root[data-cor="verde"]:not([data-theme="light"]){--accent:#4ade80;--accent-soft:#14391f}}
:root[data-theme="dark"][data-cor="verde"]{--accent:#4ade80;--accent-soft:#14391f}
:root[data-cor="laranja"]{--accent:#c2410c;--accent-soft:#fde7d9}
@media (prefers-color-scheme: dark){:root[data-cor="laranja"]:not([data-theme="light"]){--accent:#fb923c;--accent-soft:#3a2214}}
:root[data-theme="dark"][data-cor="laranja"]{--accent:#fb923c;--accent-soft:#3a2214}
:root[data-cor="roxo"]{--accent:#6d28d9;--accent-soft:#ede9fe}
@media (prefers-color-scheme: dark){:root[data-cor="roxo"]:not([data-theme="light"]){--accent:#c4b5fd;--accent-soft:#2a1f4a}}
:root[data-theme="dark"][data-cor="roxo"]{--accent:#c4b5fd;--accent-soft:#2a1f4a}
html[data-letra="grande"] body{zoom:1.12}
/* Menu ☰ */

.menub span::before,.menub span::after{content:"";position:absolute;left:0}.menub span::before{top:-6px}.menub span::after{top:6px}
.brand .sync{margin-left:auto}
#menu{position:fixed;inset:0;z-index:40}
#menu .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#menu aside{position:absolute;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 24px;display:grid;gap:16px;align-content:start;box-shadow:-8px 0 24px rgba(0,0,0,.2)}
#menu .mh{display:flex;align-items:center;justify-content:space-between}
#menu .mh h2{margin:0}
#menu .mclose{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;color:var(--fg)}

#menu .mnav{display:grid;gap:4px}
#menu .mnav button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--fg);font:600 16px var(--body);text-align:left;cursor:pointer}
#menu .mnav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
#menu .mnav button i{font-style:normal;width:24px;text-align:center}
#menu .mnav .sub{font-weight:500;font-size:15px;padding-left:28px;min-height:44px;color:var(--muted)}
#menu .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px}
#menu .seg button{min-height:40px;border:0;border-radius:8px;background:none;color:var(--fg);font:600 14px var(--body)}
#menu .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--accent)}
#menu .cores{display:flex;gap:10px}
#menu .cores button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
#menu .cores button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
#menu .mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
#menu .mrow select{max-width:150px}
#menu .sw{appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0;margin:0}
#menu .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
#menu .sw:checked{background:var(--accent)}#menu .sw:checked::after{left:23px}
#menu label.mrow{display:flex;flex-direction:row;align-items:center;justify-content:space-between;font-size:15px;color:var(--fg);gap:12px}
#menu label.mrow input.sw{width:48px;height:28px;min-height:0;padding:0;border:0;border-radius:99px;box-shadow:none}
#menu label.mrow select{width:auto;flex:none}
#menu .mtabs button{min-height:44px;font-size:15px}
#menu .mfoot{font-size:13px;color:var(--muted)}
body.menuaberto{overflow:hidden}
.brand{align-items:center;padding:8px 16px}
.brand .sync{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand .tit{flex:1;display:grid;line-height:1.05;min-width:0}
.brand .tit small{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.brand .tit small span{color:var(--accent)}
.brand h1{font-size:26px}
#menu .mnav h3{margin:12px 0 2px}
.fis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fis label{min-width:0}
.dif{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.dif.up{color:var(--ok)}.dif.down{color:var(--warn)}
.cfgsec{display:grid;gap:10px}
.cfgsec .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px}
.cfgsec .seg button{min-height:44px;border:0;border-radius:8px;background:none;color:var(--fg);font:600 15px var(--body)}
.cfgsec .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);color:var(--accent)}
.cfgsec .cores{display:flex;gap:12px}
.cfgsec .cores button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.cfgsec .cores button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.cfgsec label.mrow{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-size:15px;color:var(--fg)}
.cfgsec label.mrow input.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;min-height:0;padding:0;border:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;box-shadow:none}
.cfgsec label.mrow input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.cfgsec label.mrow input.sw:checked{background:var(--accent)}.cfgsec label.mrow input.sw:checked::after{left:23px}
.cfgsec label.mrow select{width:auto;flex:none}
.cfgsec h3{margin:0}

<script>
const PWA=true; // true na versão instalável (site próprio)
// Configurações do menu ☰ (ficam neste aparelho)
const CFG_PADRAO={tema:"auto",cor:"azul",letra:"normal",som:true,vibrar:true,descanso:0};
let CFG={...CFG_PADRAO};try{CFG={...CFG_PADRAO,...JSON.parse(localStorage.getItem("caderno-treino-v1-cfg")||"{}")}}catch(e){}
function aplicaCfg(){const h=document.documentElement;
  if(CFG.tema==="auto")delete h.dataset.theme;else h.dataset.theme=CFG.tema;
  if(CFG.cor==="azul")delete h.dataset.cor;else h.dataset.cor=CFG.cor;
  if(CFG.letra==="grande")h.dataset.letra="grande";else delete h.dataset.letra;}
function salvaCfg(){try{localStorage.setItem("caderno-treino-v1-cfg",JSON.stringify(CFG))}catch(e){}aplicaCfg()}
aplicaCfg();
// ---------- Plano de treino ----------
const PLAN = {
  push:{nome:"Push", foco:"Peito, ombro e tríceps", dia:1, ex:[
    ["Supino reto com barra","4x6-8"],["Supino inclinado com halteres","3x8-10"],["Desenvolvimento com halteres","3x8-10"],
    ["Elevação lateral","4x12-15"],["Crucifixo no peck deck","3x12"],["Tríceps na polia com corda","3x10-12"]]},
  pull:{nome:"Pull", foco:"Costas e bíceps", dia:2, ex:[
    ["Barra fixa (ou puxada alta)","4x6-10"],["Remada curvada com barra","4x8"],["Remada baixa sentado","3x10"],
    ["Face pull","3x15"],["Rosca direta com barra","3x8-10"],["Rosca martelo","3x10-12"]]},
  pernas:{nome:"Pernas", foco:"Quadríceps, posterior e panturrilha", dia:3, ex:[
    ["Agachamento livre","4x6-8"],["Leg press 45°","3x10-12"],["Stiff com barra","3x8-10"],
    ["Cadeira extensora","3x12-15"],["Mesa flexora","3x10-12"],["Panturrilha em pé","4x12-15"]]},
  superior:{nome:"Superior", foco:"Força no tronco todo", dia:4, ex:[
    ["Supino inclinado com barra","3x6-8"],["Remada cavalinho","3x8"],["Desenvolvimento militar","3x6-8"],
    ["Puxada pegada neutra","3x10"],["Paralelas (mergulho)","3x8-12"],["Rosca alternada + tríceps francês","3x12"]]},
  inferior:{nome:"Inferior + core", foco:"Pernas, glúteo e abdômen", dia:5, ex:[
    ["Levantamento terra","3x5"],["Agachamento búlgaro","3x8-10"],["Cadeira flexora","3x12"],
    ["Elevação pélvica","3x10"],["Panturrilha sentado","4x15"],["Abdominal infra","3x12-15"]]},
  casa:{nome:"Barra em casa", foco:"Opcional no fim de semana ou se faltar à academia", dia:6, ex:[
    ["Barra fixa pronada","4xmáx"],["Barra fixa supinada","3xmáx"],["Barra australiana / negativa lenta","3x8"],
    ["Elevação de pernas na barra","3x10-15"]]},
  // Calistenia em casa: mesma divisão de músculos do treino da academia que faltou. Carga = mochila nas costas (opcional).
  "c-push":{nome:"Push em casa", foco:"Calistenia: peito, ombro e tríceps", casa:true, de:"push", ex:[
    ["Flexão declinada (pés na cadeira)","4x8-15"],["Flexão pike","3x8-12"],["Mergulho entre cadeiras","3x10-15"],
    ["Flexão com descida lenta","3x10-15"],["Flexão diamante","3x8-12"],["Prancha com toque no ombro","3x20"]]},
  "c-pull":{nome:"Pull em casa", foco:"Calistenia: costas e bíceps", casa:true, de:"pull", ex:[
    ["Barra fixa pronada","4xmáx"],["Remada invertida na mesa","4x10-15"],["Barra fixa supinada","3xmáx"],
    ["Negativa lenta na barra","3x5"],["Y-T-W no chão","3x12"],["Rosca com mochila","3x12-15"]]},
  "c-pernas":{nome:"Pernas em casa", foco:"Calistenia: quadríceps, posterior e panturrilha", casa:true, de:"pernas", ex:[
    ["Agachamento búlgaro","4x10-12"],["Agachamento com salto","3x10"],["Afundo andando","3x12"],
    ["Nordic curl negativo","3x5-8"],["Ponte de glúteo unilateral","3x12-15"],["Panturrilha unilateral no degrau","4x15-20"]]},
  "c-superior":{nome:"Superior em casa", foco:"Calistenia: tronco todo", casa:true, de:"superior", ex:[
    ["Barra fixa pronada","4xmáx"],["Flexão declinada (pés na cadeira)","4x10-15"],["Remada invertida na mesa","3x10-15"],
    ["Flexão pike","3x8-12"],["Mergulho entre cadeiras","3x10-15"],["Barra fixa supinada","3xmáx"]]},
  "c-inferior":{nome:"Inferior + core em casa", foco:"Calistenia: pernas, glúteo e abdômen", casa:true, de:"inferior", ex:[
    ["Agachamento pistol assistido","3x6-8"],["Agachamento búlgaro","3x10-12"],["Nordic curl negativo","3x5-8"],
    ["Ponte de glúteo unilateral","3x12-15"],["Panturrilha unilateral no degrau","4x15-20"],["Elevação de pernas na barra","3x10-15"],["Prancha","3x45"]]}
};
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function sessaoDoDia(iso){const d=new Date(iso+"T12:00:00").getDay();if(d===0||d===6){const f=faltou(iso);return f?"c-"+f.sk:"casa"}return Object.keys(PLAN).find(k=>PLAN[k].dia===d)||"casa"}
// Primeiro treino da academia que ficou sem registro nesta semana (seg a sex, antes do dia informado)
function faltou(iso){const w=new Date(iso+"T12:00:00").getDay(),seg=addDias(iso,-((w+6)%7));
  for(let i=0;i<5;i++){const d=addDias(seg,i);if(d>=iso)break;const k=Object.keys(PLAN).find(k=>PLAN[k].dia===i+1);
    if(k&&!feitaNaSemana(k,seg,iso)){return {sk:k,d}}}
  return null}
function feitaNaSemana(k,seg,ate){for(let i=0;i<7;i++){const d=addDias(seg,i);if(d>ate)break;const x=S.days[d]?.treino?.sessao;if(x===k||x==="c-"+k)return true}return false}
// Exercícios da academia feitos com o peso do corpo (sem equipamento)
const CORPO=new Set(["Panturrilha em pé","Paralelas (mergulho)","Abdominal infra","Barra fixa (ou puxada alta)"]);
function rotuloSessao(k){const p=PLAN[k];return p.casa?"Casa":k==="casa"?"Sáb/Dom":DIAS[p.dia]}
function nSets(r){return parseInt(r)||3}

// ---------- Alimentos rápidos (valores aproximados, tabela TACO) ----------
const FOODS=[
  ["Arroz branco cozido","100 g",128,2.5,28,0.2],["Feijão carioca cozido","100 g",76,4.8,13.6,0.5],
  ["Peito de frango grelhado","100 g",159,32,0,2.5],["Patinho moído","100 g",219,35.9,0,7.3],
  ["Ovo inteiro","1 unidade",72,6.3,0.4,4.8],["Aveia em flocos","30 g",117,4.2,20,2.2],
  ["Banana prata","1 unidade",69,0.9,18,0.1],["Whey protein","30 g",120,24,3,1.5],
  ["Leite integral","200 ml",122,6.2,9.4,6.6],["Pão francês","1 unidade",150,4,29,1.6],
  ["Batata-doce cozida","100 g",77,0.6,18.4,0.1],["Pasta de amendoim","15 g",90,4,3,7.5],
  ["Azeite","1 colher (10 ml)",88,0,0,10],["Macarrão cozido","100 g",157,5.8,30.7,0.9]
];

// ---------- Como executar ----------
const HOW={
"Supino reto com barra":["Deite com olhos abaixo da barra, escápulas juntas e para baixo, pés firmes no chão.","Pegada um pouco mais aberta que os ombros. Desça a barra até a linha do mamilo, cotovelos a ~45° do tronco.","Empurre para cima e um pouco para trás, sem tirar o glúteo do banco."],
"Supino inclinado com halteres":["Banco a 30°. Escápulas presas no banco.","Desça os halteres até a altura do peito, cotovelos a ~45°.","Suba juntando levemente os halteres no topo, sem bater um no outro."],
"Desenvolvimento com halteres":["Sentado, costas apoiadas, halteres na altura das orelhas.","Empurre para cima até quase estender os cotovelos.","Desça controlando até a altura das orelhas. Não arqueie a lombar."],
"Elevação lateral":["Em pé, leve inclinação do tronco à frente, cotovelos levemente dobrados.","Suba os braços para os lados até a altura dos ombros, como se empurrasse a parede.","Desça devagar (2 s). Sem balançar o corpo."],
"Crucifixo no peck deck":["Ajuste o banco para as pegadas ficarem na altura do peito.","Feche os braços contraindo o peito, segure 1 s.","Volte devagar até sentir alongar o peito, sem passar da linha dos ombros."],
"Tríceps na polia com corda":["Cotovelos colados ao corpo e parados.","Empurre a corda para baixo e abra as mãos no final.","Volte só até o antebraço passar de 90°."],
"Barra fixa (ou puxada alta)":["Pegada pronada um pouco mais aberta que os ombros.","Comece puxando as escápulas para baixo, depois leve o peito em direção à barra.","Desça até quase estender os braços, sem soltar o corpo de vez."],
"Remada curvada com barra":["Joelhos levemente dobrados, tronco inclinado a ~45°, coluna neutra.","Puxe a barra até o umbigo, levando os cotovelos para trás.","Desça controlando. Se a lombar arredondar, reduza a carga."],

function hojeISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmtData(iso){const [y,m,d]=iso.split("-");return `${d}/${m}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function r0(n){return Math.round(n)}
function r1(n){return Math.round(n*10)/10}

function metas(p){
  const tmb=10*p.peso+6.25*p.altura-5*p.idade+(p.sexo==="m"?5:-161);
  const get=tmb*p.atividade; const kcal=get+Number(p.superavit);
  const prot=p.protkg*p.peso, gord=p.gordkg*p.peso, carb=Math.max(0,(kcal-prot*4-gord*9)/4);
  return {tmb,get,kcal,prot,gord,carb};
}

function normDay(d){if(!d||typeof d!=="object")return d;d.refeicoes=Array.isArray(d.refeicoes)?d.refeicoes:[];
  if(d.treino&&typeof d.treino==="object"){d.treino.ex=Array.isArray(d.treino.ex)?d.treino.ex:[];d.treino.ex.forEach(e=>{if(e)e.sets=Array.isArray(e.sets)?e.sets:[]});d.treino.ex=d.treino.ex.filter(Boolean)}return d}
function normDays(o){const r={};Object.entries(o||{}).forEach(([k,d])=>{if(d&&typeof d==="object")r[k]=normDay(d)});return r}
// Campos vazios do perfil voltam ao padrão em vez de virar null
function perfilLimpo(p){const r={...DEFAULT_PROFILE};Object.entries(p||{}).forEach(([k,v])=>{if(k!=="kind"&&v!=null&&v!==""&&!(typeof v==="number"&&!isFinite(v)))r[k]=v});return r}

const chains={},pend={};
function writeDoc(id,body){
  if(S.mode!=="db"){lsSave();return Promise.resolve()}
  const ref=S.col.doc(id);pend[id]=(pend[id]||0)+1;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>body===null?ref.delete():ref.set(body)).catch(e=>{
    toast(e&&e.code==="quota_exceeded"?"Espaço cheio: apague dias antigos.":"Não salvou. Tente de novo.");}).finally(()=>{pend[id]--});
  return chains[id];
}

async function init(){
  lsLoad(); try{render()}catch(e){console.error(e)}
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid)throw 0;
    S.col=db.collection("data/users/"+uid); S.mode="db";
    claude.use("assets").then(a=>{S.assets=a;if(S.tab==="cardapio")render()}).catch(()=>{});
    let first=true;
    S.col.onSnapshot(snap=>{
      const days={};let prof=null,supl=null,menu=null,fis=null;
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(v.kind==="perfil")prof=v;else if(v.kind==="suplementos")supl=v;else if(v.kind==="cardapio")menu=v;else if(v.kind==="fisico")fis=v;else if(v.kind==="day"&&v.date)days[v.date]=normDay(JSON.parse(JSON.stringify(v)))});
      if(first){ // migra o que estava só no navegador e ainda não existe na conta
        Object.keys(S.days).forEach(iso=>{if(!days[iso]){days[iso]=S.days[iso];saveDay(iso)}});
        if(!prof&&snap.empty&&Object.keys(S.days).length)saveProfile();
        if(!supl&&Object.keys(S.supl||{}).length)saveSupl();
        if(!fis&&Object.keys(S.fisico||{}).length)saveFisico();
        first=false;}
      // o que ainda está sendo gravado fica como está na tela
      for(const iso in S.days)if(pend["d-"+iso]>0)days[iso]=S.days[iso];
      S.days=days;
      if(prof&&!(pend.perfil>0))S.profile=perfilLimpo(prof);
      if(supl&&!(pend.suplementos>0))S.supl=JSON.parse(JSON.stringify(supl.items||{}));
      if(menu&&!(pend.cardapio>0))S.menu=pickMenu(menu);
      if(fis&&!(pend.fisico>0))S.fisico=JSON.parse(JSON.stringify(fis.meses||{}));
      setSync("✓ Salvo na conta"); try{render(true)}catch(e){console.error(e)}
    },()=>{S.mode="local";setSync("Salvo no navegador")});
    setSync("Sincronizando…");
  }catch(e){S.mode="local";setSync("Salvo no navegador")}
}

function beep(){try{const ac=TM.ac;if(!ac||!CFG.som)return;[0,0.35,0.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=t>0.6?1320:880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t+0.28);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.3)})}catch(e){}
  try{CFG.vibrar&&navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}}

let wakeLock=null;

function startRest(sec){

  if(!WK.start)WK.start=Date.now();

async function exportar(){
  const menu={...S.menu};delete menu.localImg;
  const data=JSON.stringify({app:"caderno-de-treino",versao:1,exportado:new Date().toISOString(),profile:S.profile,days:S.days,menu,supl:S.supl,fisico:S.fisico},null,1);

  catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Arquivo exportado");

function importar(f){
  const fr=new FileReader();
  fr.onload=async()=>{let j;try{j=JSON.parse(fr.result)}catch(e){toast("Arquivo inválido");return}
    if(!j||j.app!=="caderno-de-treino"||typeof j.days!=="object"){toast("Esse arquivo não é um backup do app");return}
    const n=Object.keys(j.days).length;
    const iguais=Object.keys(j.days).filter(d=>S.days[d]).length;
    if(iguais&&!await confirmar2("Substituir dados?",`O arquivo tem ${n} dias e ${iguais} deles já existem aqui. Os dias com a mesma data serão trocados pelos do arquivo.`,"O que está registrado nesses dias"))return;
    Object.entries(j.days).forEach(([iso,d])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(iso)&&d&&typeof d==="object"){const x=normDay({...d,kind:"day",date:iso});const num=v=>v==null||v===""?null:(Number(String(v).replace(",","."))||null);
      if(x.peso!=null)x.peso=num(x.peso);x.treino?.ex?.forEach(e=>e.sets=e.sets.map(s=>({kg:num(s?.kg),reps:num(s?.reps)})));S.days[iso]=x;saveDay(iso)}});
    if(j.profile&&typeof j.profile==="object"){S.profile=perfilLimpo(j.profile);saveProfile()}
    if(j.supl&&typeof j.supl==="object"){S.supl=j.supl;saveSupl()}
    if(j.fisico&&typeof j.fisico==="object"){S.fisico={...S.fisico,...j.fisico};saveFisico()}
    if(j.menu&&j.menu.ini&&(!S.menu.ini||j.menu.ini>S.menu.ini)){S.menu=pickMenu(j.menu);if(PWA)delete S.menu.assetId;saveMenu()}
    lsSave();toast(n===1?"1 dia importado":n+" dias importados");render();
  };
  fr.readAsText(f);
}

// Confirmação em duas etapas, em tela vermelha, antes de qualquer ação que apaga dados
function confirmar2(titulo,texto,acao){
  if(!danger.hidden)return Promise.resolve(false);
  return new Promise(res=>{
    let dgTimer;
    const esc_=e=>{if(e.key==="Escape")fim(false)};
    const fim=ok=>{danger.hidden=true;clearInterval(dgTimer);document.removeEventListener("keydown",esc_);res(ok)};
    const etapa=n=>{
      dgS.textContent=`Etapa ${n} de 2`;
      if(n===1){dgT.textContent=titulo;dgX.textContent=texto;dgOk.textContent="Sim, quero apagar";dgOk.disabled=false;dgOk.onclick=()=>etapa(2)}
      else{dgT.textContent="Tem certeza?";dgX.textContent="Isso não pode ser desfeito. "+acao+" será apagado de vez.";
        let t=3;dgOk.disabled=true;dgOk.textContent=`Apagar de vez (${t})`;
        dgTimer=setInterval(()=>{t--;if(t>0)dgOk.textContent=`Apagar de vez (${t})`;else{clearInterval(dgTimer);dgOk.disabled=false;dgOk.textContent="Apagar de vez"}},1000);
        dgOk.onclick=()=>fim(true)}
    };
    dgNo.onclick=()=>fim(false);document.addEventListener("keydown",esc_);
    etapa(1);danger.hidden=false;dgNo.focus();
  });
}

// ---------- Calendário de treinos e resumo do mês ----------
// Séries registradas num dia: o treino salvo ou, se não salvou, o que foi digitado (rascunho)
let regCache=null;
function registrosDia(iso){
  if(regCache&&regCache[iso])return regCache[iso];
  const d=S.days[iso];let r=[];
  if(d?.treino?.ex?.length)r=d.treino.ex.map(e=>({nome:e.nome,sets:(e.sets||[]).filter(s=>s&&s.reps)})).filter(e=>e.sets.length);
  else if(d?.rascunho&&PLAN[d.rascunho.sessao]){const c=d.rascunho.campos||{};
    r=PLAN[d.rascunho.sessao].ex.map(([nome,reps],i)=>{const kg=parseFloat(String(c[`kg-${i}`]??"").replace(",","."));
      return {nome,sets:Array.from({length:nSets(reps)},(_,k)=>parseInt(c[`rp-${i}-${k}`])).filter(n=>n>0).map(n=>({kg:isNaN(kg)?null:kg,reps:n}))}}).filter(e=>e.sets.length)}
  if(regCache)regCache[iso]=r;return r;
}
function melhorKg(e){return Math.max(0,...e.sets.map(s=>+s.kg||0))}
// melhor série: a de maior carga e, nessa carga, a de mais repetições
function melhorSerie(e){return e.sets.reduce((a,s)=>!a||(+s.kg||0)>(+a.kg||0)||((+s.kg||0)===(+a.kg||0)&&s.reps>a.reps)?s:a,null)}
// exercícios em que a carga subiu em relação à última vez que foram feitos
function aumentosDia(iso){
  const ds=Object.keys(S.days).filter(d=>d<iso).sort().reverse(),out=[];
  registrosDia(iso).forEach(e=>{const k=melhorKg(e);if(!k)return;
    for(const d of ds){const a=registrosDia(d).find(x=>x.nome===e.nome);if(!a)continue;const ka=melhorKg(a);if(!ka)continue;if(k>ka)out.push({nome:e.nome,de:ka,para:k});break}});
  return out;
}
function nomeSessaoDia(iso){const k=S.days[iso]?.treino?.sessao||S.days[iso]?.rascunho?.sessao;return PLAN[k]?.nome||""}
function inicioRegistros(){return Object.keys(S.days).sort().find(d=>registrosDia(d).length)||null}
// verde: pelo menos uma série; verde forte: carga maior; vermelho: dia de treino (seg a sex) que passou sem registro
function statusDia(iso,hoje,ini){
  if(registrosDia(iso).length)return aumentosDia(iso).length?"up":"ok";
  const w=wd(iso);if(w>=1&&w<=5&&ini&&iso>=ini&&iso<hoje)return "miss";
  return iso>hoje?"fut":"";
}
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function nomeMes(mes){const [y,m]=mes.split("-").map(Number);return MESES[m-1]+" de "+y}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function kgTxt(n){return String(r1(+n)).replace(".",",")}
function diasDoMes(mes){const [y,m]=mes.split("-").map(Number),n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>mes+"-"+String(i+1).padStart(2,"0"))}
function mesAnterior(mes,n=-1){const [y,m]=mes.split("-").map(Number),d=new Date(y,m-1+n,15);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function contaMes(mes){const hoje=hojeISO(),ini=inicioRegistros(),c={ok:0,up:0,miss:0};
  diasDoMes(mes).forEach(d=>{const st=statusDia(d,hoje,ini);if(st==="ok"||st==="up")c.ok++;if(st==="up")c.up++;if(st==="miss")c.miss++});return c}
function cardCalendario(){
  const hoje=hojeISO(),mesHoje=hoje.slice(0,7),mes=S.calMes&&S.calMes<=mesHoje?S.calMes:mesHoje,ini=inicioRegistros();
  const dias=diasDoMes(mes),off=(wd(dias[0])+6)%7,c=contaMes(mes);
  const rot={ok:"treinou",up:"treinou e aumentou a carga",miss:"faltou",fut:"",["" ]:"sem treino planejado"};
  const cells=dias.map(d=>{const st=statusDia(d,hoje,ini);
    return `<button class="${st}${d===hoje?" today":""}${d===S.calDia?" sel":""}" data-cal="${d}" aria-label="${DIAS[wd(d)]} ${fmtData(d)}${rot[st]?": "+rot[st]:""}">${+d.slice(8)}${st==="up"?'<i aria-hidden="true">↑</i>':""}</button>`}).join("");
  let det="";
  if(S.calDia&&S.calDia.slice(0,7)===mes){const d=S.calDia,st=statusDia(d,hoje,ini),ex=registrosDia(d),up=aumentosDia(d);

    det=`<div class="caldia"><div class="row between"><b>${DIAS_LONGO[wd(d)]} · ${fmtData(d)}</b>${pd?`<b class="${pd>0?"subiu":"neg"}">${pd>0?"+":"−"}${Math.abs(pd)} pontos</b>`:""}</div>${
      ex.length?`<span>${esc(nomeSessaoDia(d))} · ${ex.length} ${ex.length===1?"exercício":"exercícios"} · ${ex.reduce((a,e)=>a+e.sets.length,0)} séries</span>${up.map(u=>`<span class="subiu">↑ ${esc(u.nome)}: ${kgTxt(u.de)} → ${kgTxt(u.para)} kg</span>`).join("")}`
      :st==="miss"?`<span>Faltou: nenhuma série registrada no ${esc(PLAN[sessaoDoDia(d)]?.nome||"treino")}.</span>`:`<span class="muted">Sem treino registrado.</span>`}

  return `<section class="card" id="cardCal">

    <div class="calnum"><div><b>${c.ok}</b><small>${c.ok===1?"dia de treino":"dias de treino"}</small></div><div><b>${c.miss}</b><small>${c.miss===1?"falta":"faltas"}</small></div><div><b>${c.up}</b><small>${c.up===1?"dia com carga maior":"dias com carga maior"}</small></div></div>
    ${pontosHtml(mes)}
    <div class="cal">${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(x=>`<span class="wh">${x}</span>`).join("")}${'<span></span>'.repeat(off)}${cells}</div>
    <div class="calleg"><span><em class="ok"></em>Treinou</span><span><em class="up"></em>↑ Carga maior</span><span><em class="miss"></em>Faltou</span><span><em></em>Descanso</span></div>
    ${det}
  </section>`;
}
// Resumo do mês: melhor série de cada exercício no começo e no fim do mês
function cardResumoMes(mes){
  const hoje=hojeISO(),dias=diasDoMes(mes).filter(d=>d<=hoje),c=contaMes(mes),parcial=mes===hoje.slice(0,7);
  const por={};dias.forEach(d=>registrosDia(d).forEach(e=>{(por[e.nome]=por[e.nome]||[]).push({d,b:melhorSerie(e),tot:e.sets.reduce((a,s)=>a+s.reps,0)})}));
  const fmt=b=>b?(+b.kg?`${kgTxt(b.kg)} kg × ${esc(b.reps)}`:`${esc(b.reps)} reps`):"-";
  const linhas=Object.entries(por).map(([nome,v])=>{const a=v[0],z=v.at(-1),dk=(+z.b.kg||0)-(+a.b.kg||0),dr=z.b.reps-a.b.reps;
    const mud=v.length<2?`<span class="mud muted">1 vez no mês</span>`:dk>0?`<span class="mud subiu">↑ +${kgTxt(dk)} kg</span>`:dk<0?`<span class="mud">${kgTxt(dk)} kg</span>`:dr>0?`<span class="mud subiu">↑ +${dr} reps</span>`:dr<0?`<span class="mud">${dr} reps</span>`:`<span class="mud muted">igual</span>`;
    const ev=v.length>1&&(dk>0||(dk===0&&dr>0));
    return {nome,dk,dr,ev,html:`<tr><td>${esc(nome)}<small>${v.length}× no mês</small></td><td class="r">${v.length<2?fmt(z.b):`${fmt(a.b)} → ${fmt(z.b)}`}${mud}</td></tr>`}});
  linhas.sort((x,y)=>y.dk-x.dk||y.dr-x.dr);
  const ev=linhas.filter(l=>l.ev),resto=linhas.filter(l=>!l.ev);
  const tab=ls=>`<div class="tablewrap"><table class="resumo">${ls.map(l=>l.html).join("")}</table></div>`;
  return `<section class="card" id="cardResumo"><div class="row between"><h2>Resumo de ${nomeMes(mes).split(" ")[0]}</h2>${parcial?`<span class="chip">até hoje</span>`:""}</div>
    ${linhas.length?`<p>${(()=>{const p=pontosMes(mes);return `<b>${p.total} de ${p.meta} pontos</b>${p.total>=p.meta?" · meta batida 🎉":""}. `})()}${c.ok} ${c.ok===1?"treino":"treinos"}, ${c.miss} ${c.miss===1?"falta":"faltas"}. ${ev.length} de ${linhas.length} exercícios evoluíram em carga ou repetições.</p>
    ${ev.length?`<h3>O que evoluiu</h3>${tab(ev)}`:""}
    ${resto.length?`<details class="more"><summary>${ev.length?"Os outros":"Todos os"} ${resto.length} exercícios</summary>${tab(resto)}</details>`:""}
    <p class="small muted">Melhor série (maior carga) da primeira e da última vez no mês.</p>`
    :`<p class="empty">Nenhuma série registrada em ${nomeMes(mes).split(" ")[0]}.</p>`}
  </section>`;
}
// Pontos: treino em dia útil +10, treino extra no fim de semana +5, cada exercício com carga maior +5, falta −10
const PTS={treino:10,extra:5,carga:5,falta:-10};
function pontosDia(iso,hoje,ini){const st=statusDia(iso,hoje,ini),w=wd(iso),fds=w===0||w===6,r={treino:0,extra:0,carga:0,falta:0};
  if(st==="ok"||st==="up"){if(fds)r.extra=PTS.extra;else r.treino=PTS.treino;r.carga=aumentosDia(iso).length*PTS.carga}
  if(st==="miss")r.falta=PTS.falta;r.total=r.treino+r.extra+r.carga+r.falta;return r}
function metaMes(mes){return diasDoMes(mes).filter(d=>{const w=wd(d);return w>=1&&w<=5}).length*PTS.treino+20}
function pontosMes(mes){const hoje=hojeISO(),ini=inicioRegistros(),t={treino:0,extra:0,carga:0,falta:0,total:0};
  diasDoMes(mes).forEach(d=>{if(d>hoje)return;const p=pontosDia(d,hoje,ini);for(const k in t)t[k]+=p[k]});t.meta=metaMes(mes);return t}
function pontosHtml(mes){const p=pontosMes(mes),pct=Math.max(0,Math.min(100,p.total/p.meta*100)),bateu=p.total>=p.meta,falta=p.meta-p.total;
  return `<div class="pts" aria-label="Pontos do mês"><div class="row between"><div class="tot">${p.total} <small>de ${p.meta} pontos</small></div>${bateu?`<span class="chip">Meta batida 🎉</span>`:""}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <ul><li><span>Treinos (+10)</span><b>+${p.treino}</b></li><li><span>Carga maior (+5)</span><b>+${p.carga}</b></li><li><span>Fim de semana (+5)</span><b>+${p.extra}</b></li><li><span>Faltas (−10)</span><b class="${p.falta?"neg":""}">${p.falta?"−"+(-p.falta):"0"}</b></li></ul>
    ${bateu?"":`<span class="small muted">Faltam ${falta} pontos para a meta${mes===hojeISO().slice(0,7)?" deste mês":""}.</span>`}</div>`}

// ---------- Sequência ----------
function addDias(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function wd(iso){return new Date(iso+"T12:00:00").getDay()}
function treinou(iso){return !!S.days[iso]?.treino}
function seqTreino(){
  // conta dias úteis seguidos com treino; fim de semana não quebra; hoje sem treino ainda não quebra
  const hoje=hojeISO();let d=hoje,n=0;
  if(!treinou(d))d=addDias(d,-1);
  for(let i=0;i<400;i++){const w=wd(d);
    if(w===0||w===6){if(treinou(d))n++;d=addDias(d,-1);continue}
    if(!treinou(d))break;n++;d=addDias(d,-1)}
  return n;
}
function recordeTreino(){
  const ds=Object.keys(S.days).filter(treinou).sort();if(!ds.length)return 0;
  let best=0,cur=0,d=ds[0];const end=hojeISO();
  while(d<=end){const w=wd(d);
    if(treinou(d)){cur++;best=Math.max(best,cur)}else if(w!==0&&w!==6&&d!==end)cur=0;
    d=addDias(d,1)}
  return best;
}
function bateuProt(iso){const M=metas(profileVivo());return totaisDia(iso).p>=M.prot*0.9}
function seqProt(){let d=hojeISO(),n=0;if(!bateuProt(d))d=addDias(d,-1);for(let i=0;i<400&&bateuProt(d);i++){n++;d=addDias(d,-1)}return n}
function cardStreak(){
  const hoje=hojeISO(),w=wd(hoje),seg=addDias(hoje,-((w+6)%7));
  const dots=[0,1,2,3,4].map(i=>{const d=addDias(seg,i);return `<span class="${treinou(d)?"on":""} ${d===hoje?"today":""}" title="${fmtData(d)}">${DIAS[i+1]}</span>`}).join("");
  const st=seqTreino(),rec=Math.max(recordeTreino(),st),sp=seqProt();
  return `<section class="card">
    <div class="row between"><h2>Sequência</h2><div class="week" aria-label="Treinos desta semana">${dots}</div></div>
    <div class="streak">
      <div><h3>Treinos seguidos</h3><div class="big">${st} <small>recorde ${rec}</small></div></div>
      <div><h3>Dias na meta de proteína</h3><div class="big">${sp} <small>${sp===1?"dia":"dias"}</small></div></div>
    </div>
    <p class="small muted">${st?"Não quebre a sequência: fim de semana não conta como falta.":"Salve o treino de hoje para começar a sequência."}</p>
  </section>`;
}
function jantarHoje(iso){const w=wd(iso),e=menuAtual()?S.menu?.escolhas?.[w]:"";if(!e)return "";
  return `<section class="card"><div class="jantar"><h3>Jantar no trabalho</h3><span>${esc(e)}</span></div></section>`}

      ${podeEnviar?`<label>Foto do cardápio<input id="mFile" type="file" accept="image/png,image/jpeg,image/webp,application/pdf"></label>`:`<span class="small muted">Só quem edita o app pode enviar foto.</span>`}
    </div>
  </section>

    <div class="picks">${[1,2,3,4,5].map(i=>`<label><b>${DIAS[i]}</b><input id="pk${i}" value="${esc(menuAtual()?m.escolhas?.[i]||"":"")}" placeholder="${esc(!menuAtual()&&m.escolhas?.[i]?"Semana passada: "+m.escolhas[i]:"Ex.: Frango grelhado + arroz + feijão")}"></label>`).join("")}</div>
    <div class="row"><button class="btn" id="salvarMenu">Salvar semana</button><span class="small muted">A escolha do dia aparece na aba Hoje.</span></div>
  </section>`;
  salvarMenu.onclick=()=>{const m=S.menu;m.semana=mSem.value.trim();m.ini=semanaRef(hojeISO());m.escolhas={};[1,2,3,4,5].forEach(i=>m.escolhas[i]=document.getElementById("pk"+i).value.trim());saveMenu();toast("Semana salva")};
  if(window.mFile)mFile.onchange=e=>{const f=e.target.files[0];if(f)salvarFotoCardapio(f,mSem.value.trim())};
}
// reduz a foto (máx. 1600 px, JPEG) para caber no navegador
function fotoReduzida(f){return new Promise(res=>{if(!/^image\//.test(f.type)){const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(f);return}
  const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.72))};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
function semanaRef(iso){const w=wd(iso);return addDias(iso,w===0?1:w===6?2:1-w)}
function rotuloSemana(seg){return fmtData(seg)+" a "+fmtData(addDias(seg,4))}
function menuAtual(){return !!S.menu?.ini&&semanaRef(S.menu.ini)===semanaRef(hojeISO())}
// cardápio de outra semana: começa a semana nova sem as escolhas antigas
function novaSemanaMenu(m,semana){const seg=semanaRef(hojeISO());if(!menuAtual()){m.escolhas={};m.semana=semana&&semana!==m.semana?semana:rotuloSemana(seg)}else if(semana)m.semana=semana;m.ini=seg}
async function salvarFotoCardapio(f,semana){
    if(S.mode==="db"&&S.assets){toast("Enviando…");
      try{const r=await S.assets.upload(f);const m=S.menu,old=m.assetId;novaSemanaMenu(m,semana);m.assetId=r.id;m.isPdf=r.contentType==="application/pdf";delete m.localImg;await saveMenu();
        if(old&&old!==r.id&&old!==DEFAULT_MENU.assetId)S.assets.delete(old).catch(()=>{});toast("Cardápio salvo");render()}
      catch(err){toast(err&&err.code==="too_large"?"Arquivo grande demais (máx. 20 MB).":err&&err.code==="unsupported_type"?"Use uma foto PNG, JPG ou PDF.":"Não enviou. Tente de novo.")}}
    else{const url=await fotoReduzida(f);if(!url){toast("Não consegui abrir essa foto");return}const m=S.menu;
      novaSemanaMenu(m,semana);m.localImg=url;m.assetId=null;m.isPdf=f.type==="application/pdf";saveMenu();toast(PWA?"Cardápio salvo":"Cardápio salvo neste navegador");render()}
}

function cardSuplDia(iso){const d=S.days[iso]?.supl||{};

  <label><input type="checkbox" id="sWh" ${d.whey?"checked":""}>Whey</label></div></div></section>`}
function bindSuplDia(iso){[["sCr","creatina"],["sWh","whey"]].forEach(([id,k])=>{const el=document.getElementById(id);if(!el)return;
  el.onchange=()=>{const d=getDay(iso);d.supl={...(d.supl||{}),[k]:el.checked};saveDay(iso);toast(el.checked?"Marcado":"Desmarcado")}})}
function seqCreatina(){let d=hojeISO(),n=0;const ok=x=>!!S.days[x]?.supl?.creatina;if(!ok(d))d=addDias(d,-1);for(let i=0;i<400&&ok(d);i++){n++;d=addDias(d,-1)}return n}
function vSupl(root=app){

  const bloco=tipo=>`<section class="card"><div class="row between"><h2>${SUPL_TIPO[tipo].t}</h2>${tipo==="creatina"?`<span class="chip">${seq} ${seq===1?"dia seguido":"dias seguidos"}</span>`:""}</div>

        <span class="small"><a href="${x.link}" target="_blank" rel="noopener">Comprar: ${esc(x.loja)}</a>${x.ref?` · referência ${x.ref}`:""}</span>
        ${x.cupom?`<span class="small"><b>Cupom indicado:</b> ${esc(CUPOM[x.cupom])}</span>`:""}
        <div class="f">
          <label>Valor encontrado (R$)<input id="pr-${x.id}" inputmode="decimal" value="${esc(u.preco||"")}" placeholder="${x.ref?x.ref.replace("~R$ ","").split(" ")[0]:"Ex.: 99,90"}"></label>
          <label>Cupom<input id="cp-${x.id}" value="${esc(u.cupom||"")}" placeholder="Cupom que funcionou"></label>
        </div>
        <div class="row"><button class="ghost" data-save="${x.id}">Salvar</button><button class="ghost" data-pick="${x.id}">${u.escolhido?"Desmarcar":"É o que eu uso"}</button></div>
      </div>`}).join("")}</div></section>`;
  root.innerHTML=`${bloco("creatina")}${bloco("whey")}
  <section class="card"><h3>Sobre preços e cupons</h3>
  <p class="small">Cupons pesquisados em 01/10/2026 em sites de cupons (Cuponomia, DescontoStop), que os marcaram como testados nos últimos dias. Eles expiram sem aviso: se um falhar no carrinho, tente o segundo. Anote no campo "Cupom" o que funcionou. Confira também o selo de laudo aprovado antes de comprar.</p></section>`;
  root.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const id=b.dataset.save;
    S.supl[id]={...(S.supl[id]||{}),preco:document.getElementById("pr-"+id).value.trim(),cupom:document.getElementById("cp-"+id).value.trim()};saveSupl();toast("Salvo")});
  root.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const id=b.dataset.pick,x=SUPL.find(y=>y.id===id),on=!S.supl[id]?.escolhido;
    SUPL.filter(y=>y.tipo===x.tipo).forEach(y=>{if(S.supl[y.id])S.supl[y.id].escolhido=false});
    S.supl[id]={...(S.supl[id]||{}),escolhido:on};saveSupl();render()});
}

function vProgresso(){
  const ds=Object.keys(S.days).sort();
  const pesos=ds.filter(d=>S.days[d].peso).map(d=>[d,S.days[d].peso]);
  const nomes=[...new Set(ds.flatMap(d=>S.days[d].treino?.ex?.filter(e=>e.sets.some(s=>s.kg)).map(e=>e.nome)||[]))];
  if(!S.exSel||!nomes.includes(S.exSel))S.exSel=nomes[0]||null;
  const prog=S.exSel?ds.map(d=>{const e=S.days[d].treino?.ex?.find(x=>x.nome===S.exSel);if(!e)return null;
    const best=e.sets.filter(s=>s.kg&&s.reps).reduce((a,s)=>{const rm=s.kg*(1+s.reps/30);return rm>a.rm?{...s,rm}:a},{rm:0});
    return best.rm?[d,best]:null}).filter(Boolean):[];
  const recent=ds.slice().reverse().slice(0,30);
  regCache={};const calHtml=cardCalendario()+cardResumoMes(S.calMes&&S.calMes<=hojeISO().slice(0,7)?S.calMes:hojeISO().slice(0,7));regCache=null;
  app.innerHTML=`${cardStreak()}${calHtml}
  <section class="card"><div class="row between"><h2>Peso corporal</h2>${pesos.length?`<span class="chip p">${esc(pesos.at(-1)[1])} kg${pesos.length>1?` · ${(pesos.at(-1)[1]-pesos[0][1]>=0?"+":"")}${r1(pesos.at(-1)[1]-pesos[0][1])} kg`:""}</span>`:""}</div>

  </section>

    ${prog.length>=2?chart(prog.map(([d,b])=>[d,r1(b.rm)]),"kg (1RM est.)"):""}
    ${prog.length?`<div class="tablewrap"><table><tr><th>Data</th><th class="r">Melhor série</th><th class="r">1RM estimado</th></tr>${prog.slice().reverse().map(([d,b])=>`<tr><td>${fmtData(d)}</td><td class="r">${esc(b.kg)} kg × ${esc(b.reps)}</td><td class="r">${r1(b.rm)} kg</td></tr>`).join("")}</table></div>`:`<p class="empty">Salve treinos com carga em "Hoje" para acompanhar a evolução de cada exercício.</p>`}
  </section>
  <section class="card"><h2>Histórico</h2>
    ${recent.length?`<div class="tablewrap"><table><tr><th>Data</th><th>Treino</th><th class="r">Volume</th><th class="r">kcal</th><th class="r">Prot</th><th class="r">Peso</th></tr>
    ${recent.map(d=>{const x=S.days[d],t=totaisDia(d);const vol=x.treino?x.treino.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.kg||0)*(s.reps||0),0),0):0;
      return `<tr><td>${DIAS[new Date(d+"T12:00:00").getDay()]} ${fmtData(d)}</td><td>${x.treino?PLAN[x.treino.sessao]?.nome||"-":"-"}</td><td class="r">${vol?r0(vol)+" kg":"-"}</td><td class="r">${t.kcal?r0(t.kcal):"-"}</td><td class="r">${t.p?r0(t.p)+" g":"-"}</td><td class="r">${x.peso?esc(x.peso)+" kg":"-"}</td></tr>`}).join("")}
    </table></div>`:`<p class="empty">Seu histórico aparece aqui depois do primeiro treino ou refeição salva.</p>`}
  </section>`;
  if(window.exSel)exSel.onchange=e=>{S.exSel=e.target.value;render()};
  bindCalendario();
}

function chart(pts,unit){
  const W=640,H=200,pl=40,pr=14,pt=14,pb=26;
  const vs=pts.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<2){mn-=1;mx+=1}
  const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const x=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1)),y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const ticks=[mn+pad,(mn+mx)/2,mx-pad];
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area=`${line}L${x(pts.length-1).toFixed(1)},${H-pb}L${pl},${H-pb}Z`;
  const lbl=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico em ${unit}" style="min-width:320px">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${r1(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="${i===pts.length-1?5:3}" fill="var(--accent)"/>`).join("")}
    ${lbl.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${fmtData(pts[i][0])}</text>`).join("")}
  </svg></div>`;
}
